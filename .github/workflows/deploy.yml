name: Build & Deploy to OVH

on:
  push:
    branches:
      - main
  # Rebuild + redéploiement hebdo : image à jour (Node/Alpine) et logs du pod remis à zéro
  schedule:
    - cron: '0 3 * * 1' # chaque lundi 3h UTC (4h ou 5h à Paris)
  workflow_dispatch:

# Le workflow n'a besoin que de lire le code
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t ${{ secrets.REGISTRY_URL }}/overbot:latest ./server

      - name: Login to private registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Push Docker image backend
        run: docker push ${{ secrets.REGISTRY_URL }}/overbot:latest
